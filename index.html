const OUT=/\b(pague|gaste|compre|abono|abone|me cobraron|se me fue)\b/,IN=/\b(gane|ganancia|cobre|me pagaron|vendi|ingrese|recibi|me depositaron|me dieron|me entro)\b/,BILL=/\b(tengo que|debo|pagar|vence|vencen|toca|hay que|pendiente)\b/;

const NW={un:1,uno:1,una:1,primero:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30};

function getDate(ctx,fut){fixTypos(ctx);const t=today(),Y=ymd,y0=t.getFullYear(),m0=t.getMonth(),td=t.getDay();
const shift=(n,u)=>Y(u[0]==='d'?addDays(t,n):u[0]==='s'?addDays(t,7*n):mk(y0,m0+n,t.getDate()));

const adjD=d=>{let x=mk(y0,m0,d);if(fut&&x<t)x=mk(y0,m0+1,d);if(!fut&&x>t)x=mk(y0,m0-1,d);return Y(x)};
const wd=w=>Y(addDays(t,fut?((w-td+7)%7||7):-((td-w+7)%7||7)));
const W=[
[/\b(?:esta manana|esta noche|esta tarde|hoy mismo|hoy|ahorita|ahora)\b/,()=>Y(t)],
[/\b(?:anteayer|antier|anteanoche)\b/,()=>Y(addDays(t,-2))],
[/\b(?:ayer|anoche)\b/,()=>Y(addDays(t,-1))],
[/\bpasado manana\b/,()=>Y(addDays(t,2))],
[/\bmanana\b/,()=>Y(addDays(t,1))]];
const S=[
[new RegExp('\\bhace\\s+'+NUMR+'\\s+(dias?|semanas?|meses|mes)\\b'),r=>shift(-nv(r[1]),r[2])],
[new RegExp('\\b(?:en|dentro de|de aqui a)\\s+'+NUMR+'\\s+(dias?|semanas?|meses|mes)\\b'),r=>shift(nv(r[1]),r[2])],
[new RegExp('\\b(?:el\\s+)?('+DIA.join('|')+')\\s+(?:de|en|para)\\s+la\\s+(?:otra|proxima|siguiente|prox)\\s+semana\\b'),r=>Y(addDays(t,-((td+6)%7)+7+((DIA.indexOf(r[1])+6)%7)))],
[/\b(?:la\s+)?(?:proxima|prox|otra|siguiente)\s+semana\b|\bla semana que viene\b|\bsemana entrante\b/,()=>Y(addDays(t,7))],
[/\b(?:el\s+)?(?:proximo mes|prox mes|mes que viene|mes entrante)\b/,()=>shift(1,'m')],
[/\b(?:fin|final|fines)\s+(?:de|del)\s+mes\b|\bultimo dia\s+(?:de|del)\s+mes\b/,()=>Y(mk(y0,m0+(fut||mk(y0,m0,31)<=t?0:-1),31))],
[/\bmediados\s+(?:de|del)\s+mes\b|\bmitad\s+(?:de|del)\s+mes\b/,()=>adjD(15)],
[/\b(?:fin de\s+)?quincena\b/,()=>fut?(td<=15&&t.getDate()<=15?adjD(15):Y(mk(y0,m0,31))):(t.getDate()>=15?adjD(15):Y(mk(y0,m0-1,31)))],
[/\b(?:este\s+)?(?:fin de semana|finde)\b/,()=>wd(6)],
[new RegExp('\\b'+NUMR+ORDR+'\\s*(?:de\\s+|del\\s+|[\\-\\/]\\s*)?('+MONR+')\\.?(?:\\s*(?:de\\s+|del\\s+|,\\s*)?(\\d{4}))?\\b'),r=>{const d=nv(r[1]);return d>=1&&d<=31?adjM(monIdx(r[2]),d,r[3]):null}],
[new RegExp('\\b('+MONR+')\\.?\\s+(\\d{1,2})(?!\\d)(?:\\s*,?\\s*(\\d{4}))?\\b'),r=>+r[2]>=1&&+r[2]<=31?adjM(monIdx(r[1]),+r[2],r[3]):null],
[/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/,r=>{let d=+r[1],mo=+r[2];if(mo>12&&d<=12)[d,mo]=[mo,d];if(mo<1||mo>12||d<1||d>31)return null;return adjM(mo-1,d,r[3]?(+r[3]<100?2000+ +r[3]:+r[3]):0)}],
[new RegExp('\\b(?:(este|esta|proximo|prox|pasado|el proximo|el pasado|el|para el)\\s+)?('+DIA.join('|')+')(?:\\s+(pasado|que viene|proximo|prox|siguiente))?\\b'),r=>{const w=DIA.indexOf(r[2]),mod=(r[1]||'')+' '+(r[3]||'');
if(/pasado/.test(mod))return Y(addDays(t,-((td-w+7)%7||7)));if(/prox|que viene|siguiente/.test(mod))return Y(addDays(t,(w-td+7)%7||7));if(/este|esta/.test(mod))return Y(addDays(t,(w-td+7)%7));return wd(w)}],
[/\bel\s+(lun|mie|mier|jue|vie|sab|dom)\b/,r=>wd({lun:1,mie:3,mier:3,jue:4,vie:5,sab:6,dom:0}[r[1]])],
[new RegExp('\\b(?:el dia|dia|el|para el|hasta el|antes del|los|todos los)\\s+'+NUMR+ORDR+'(?:\\s+dia)?\\b(?!\\s*(?:dolar|usd|\\$|mil\\b|k\\b|%))'),r=>{const d=nv(r[1]);return d>=1&&d<=31?adjD(d):null}]];
for(const [re,fn] of (fut?S.concat(W):W.concat(S))){const r=re.exec(ctx.n);if(!r)continue;const v=fn(r);if(v!=null){blank(ctx,re);return v}}
return null}
function getAmount(ctx){const m=/\$?\s*(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:[.,]\d+)?)\s*(mil\b|k\b)?/.exec(ctx.n);if(!m)return 0;

const VERB=new Set('hola holi buenas hey hoy ayer manana ahora ahorita anoche antier abono abone liquide salde cancele completo completa gane gaste pague compre cobre vendi recibi ingrese debo pagar vence vencen toca tengo ya dolares dolar usd'.split(' ')),EDGE=new Set('de del en por para la el los las un una mi mis y con a que tambien al lo se me'.split(' '));
function cleanDesc(ctx){blank(ctx,/\b(tengo que pagar|tengo que|debo pagar|toca pagar|hay que pagar|me pagaron|me depositaron|me dieron|me cobraron|me entro|ya pague)\b/);

const sumP=(t,p)=>S.tx.filter(x=>x.type===t&&inP(x.date,p)).reduce((s,x)=>s+x.amt,0);
const bal=()=>sumP('in','all')-sumP('out','all');
const pend=()=>S.bills.filter(b=>!b.paid);
const pendSum=()=>pend().reduce((s,b)=>s+b.amt,0);
const matchBill=(b,n)=>norm(b.desc).split(/\s+/).some(w=>w.length>2&&n.includes(w))||(b.cat!=='Otros'&&catOf(n,'out')===b.cat);
function clause(c){const ctx={o:c,n:norm(c)},n0=ctx.n;
if(isDebtDef(n0)){const r=debtDef(ctx,n0);if(r)return r}
const type=OUT.test(n0)?'out':IN.test(n0)?'in':BILL.test(n0)?'bill':null;if(!type)return{bad:c};

function splitClauses(o){const n=norm(o),V='gane|gaste|pague|abono|abone|compre|cobre|vendi|debo|tengo que|me pagaron|recibi|ya pague';
